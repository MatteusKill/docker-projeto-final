http:
  routers:
    application:
      entryPoints:
        - web
      rule: PathPrefix(`/`)
      service: nginx

    dashboard:
      entryPoints:
        - management
      rule: PathPrefix(`/api`) || PathPrefix(`/dashboard`)
      service: api@internal

  services:
    nginx:
      loadBalancer:
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s
        servers:
          - url: http://nginx:8080
