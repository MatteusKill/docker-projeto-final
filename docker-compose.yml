name: projeto-final-basico

services:
  nginx:
    image: projeto-final-basico/nginx:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: nginx/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - ./logs/nginx:/var/log/nginx
    depends_on:
      php:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 128m
    pids_limit: 100
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  php:
    image: projeto-final-basico/php:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: php/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      BACKEND_BASE_URL: http://backend:8000
    networks:
      - web
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 192m
    pids_limit: 100
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: projeto-final-basico/backend:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:?execute ./scripts/setup.sh}
      DB_USER: ${MYSQL_USER:?execute ./scripts/setup.sh}
      DB_PASSWORD: ${MYSQL_PASSWORD:?execute ./scripts/setup.sh}
      LOG_FILE: /app/logs/backend.log
    volumes:
      - ./logs/backend:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - web
      - data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 256m
    pids_limit: 120
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.4.5
    user: "999:999"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?execute ./scripts/setup.sh}
      MYSQL_USER: ${MYSQL_USER:?execute ./scripts/setup.sh}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?execute ./scripts/setup.sh}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?execute ./scripts/setup.sh}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 512m
    pids_limit: 200
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
  data:
    internal: true

volumes:
  mysql_data:
